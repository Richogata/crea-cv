<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — CréaCV</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0f0f0f;--paper:#faf9f7;--gold:#c9943a;--border:#e2ded8;--error:#c0392b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .box{background:var(--paper);border-radius:16px;padding:48px 40px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
  .logo{text-align:center;margin-bottom:32px;}
  .logo h1{font-family:'DM Serif Display',serif;font-size:1.8rem;color:var(--ink);}
  .logo p{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#888;margin-top:4px;}
  label{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#888;display:block;margin-bottom:6px;}
  input[type="password"]{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:8px;font-size:15px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s;}
  input:focus{border-color:var(--gold);}
  .form-group{margin-bottom:20px;}
  .btn{width:100%;background:var(--ink);color:white;border:none;padding:14px;border-radius:8px;font-size:15px;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;transition:all 0.2s;margin-top:8px;}
  .btn:hover{background:#333;}
  .flash{margin-bottom:16px;padding:12px 16px;border-radius:8px;font-size:13px;background:#fef2f2;border:1.5px solid #fca5a5;color:var(--error);}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <h1>CréaCV</h1>
    <p>Panel Administration</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  <form method="POST">
    <div class="form-group">
      <label>Mot de passe admin</label>
      <input type="password" name="password" placeholder="••••••••" autofocus required>
    </div>
    <button type="submit" class="btn">Accéder au panel →</button>
  </form>
</div>
</body>
</html>
